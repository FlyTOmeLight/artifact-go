<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1420 825" role="img" aria-label="artifact-go 分层架构：接入、业务、数据与存储边界，两侧为治理和外部服务"><title>artifact-go 分层架构：接入、业务、数据与存储边界，两侧为治理和外部服务</title><style>text{font-family:"IBM Plex Sans","Noto Sans SC","PingFang SC",sans-serif;fill:var(--text,#e3ecf5);font-size:17px} .sub{fill:var(--dim,#a9bacb);font-size:14px}.label{fill:var(--dim,#a9bacb);font-size:14px;paint-order:stroke;stroke:var(--bg,#0d1520);stroke-width:6px;stroke-linejoin:round}.box{fill:var(--surface,#132031);stroke:var(--line,#7286a0);stroke-width:1.5}.key{stroke:var(--accent,#ffb547);stroke-width:2.5}.boundary{fill:none;stroke:var(--line,#7286a0);stroke-width:1.5;stroke-dasharray:7 5}.edge{fill:none;stroke:var(--dim,#a9bacb);stroke-width:1.75;marker-end:url(#arrow)}.hot{stroke:var(--accent,#ffb547);stroke-width:2.5}.async{stroke-dasharray:7 5}.bad{stroke:var(--risk,#ff8a7c)}.rail{fill:var(--surface,#132031);stroke:var(--line,#7286a0);stroke-width:1}.node:hover .box,.node:focus .box{stroke:var(--accent,#ffb547);stroke-width:3}.node{outline:none}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="context-stroke"/></marker></defs><rect width="1420" height="825" fill="var(--bg,#0d1520)"/><rect class="boundary" x="270" y="195" width="800" height="555" rx="4"/><text class="sub" x="286" y="220">artifact-go 核心请求路径 · 每个副本共享数据库与对象存储</text><g class="node" tabindex="0"><title>调用方与 Go SDK</title><rect class="box" x="310" y="90" width="720" height="85" rx="4"/><text x="326" y="119" font-weight="600">调用方与 Go SDK</text><text class="sub" x="326" y="144">前端 / CLI / 服务调用方 · sdk/go/artifactv1/</text></g><g class="node" tabindex="0"><title>HTTP 接入层</title><rect class="box" x="310" y="220" width="720" height="110" rx="4"/><text x="326" y="249" font-weight="600">HTTP 接入层</text><text class="sub" x="326" y="274">server-go 路由、绑定、错误响应、日志</text><text class="sub" x="326" y="297">Middleware 验证身份，写入 UserID / TenantID / ProjectID</text></g><g class="node" tabindex="0"><title>业务 Modules · internal/app</title><rect class="box key" x="310" y="375" width="720" height="150" rx="4"/><text x="326" y="404" font-weight="600">业务 Modules · internal/app</text><text class="sub" x="326" y="429">artifact 集合 / version 发布与编号 / alias 引用</text><text class="sub" x="326" y="452">file 登记/核验/下载 / retention 策略与计算 / resolve 引用解析</text><text class="sub" x="326" y="475">storage 管理入口；version 拥有发布事务；暂不校验操作权限</text></g><g class="node" tabindex="0"><title>数据层 · internal/table</title><rect class="box" x="310" y="575" width="335" height="125" rx="4"/><text x="326" y="604" font-weight="600">数据层 · internal/table</text><text class="sub" x="326" y="629">按八张表分文件 / AutoMigrate</text><text class="sub" x="326" y="652">主库查询、唯一约束、传入 tx</text></g><g class="node" tabindex="0"><title>外部客户端 · storage</title><rect class="box" x="690" y="575" width="340" height="125" rx="4"/><text x="706" y="604" font-weight="600">外部客户端 · storage</text><text class="sub" x="706" y="629">短期凭证 / Stat / Open / Delete</text><text class="sub" x="706" y="652">转换 S3 与临时授权协议</text></g><g class="node" tabindex="0"><title>生命周期与运行治理</title><rect class="box" x="20" y="220" width="210" height="150" rx="4"/><text x="36" y="249" font-weight="600">生命周期与运行治理</text><text class="sub" x="36" y="274">service / config</text><text class="sub" x="36" y="297">显式构造、启动与退出</text><text class="sub" x="36" y="320">观测与 requestID</text><text class="sub" x="36" y="343">worker 并发、DB 连接池</text></g><g class="node" tabindex="0"><title>后台任务执行</title><rect class="box" x="20" y="420" width="210" height="175" rx="4"/><text x="36" y="449" font-weight="600">后台任务执行</text><text class="sub" x="36" y="474">保留扫描 / 会话到期</text><text class="sub" x="36" y="497">DB 任务租约与续租</text><text class="sub" x="36" y="520">逻辑删除后的完整对象 GC</text><text class="sub" x="36" y="543">失败重试 / 迟到对象回收</text></g><g class="node" tabindex="0"><title>PG 或 MySQL 主库</title><rect class="box" x="1110" y="300" width="250" height="125" rx="4"/><text x="1126" y="329" font-weight="600">PG 或 MySQL 主库</text><text class="sub" x="1126" y="354">版本、会话、幂等与任务</text><text class="sub" x="1126" y="377">编号和状态的事实来源</text></g><g class="node" tabindex="0"><title>S3 对象存储与临时授权</title><rect class="box key" x="1110" y="500" width="250" height="175" rx="4"/><text x="1126" y="529" font-weight="600">S3 对象存储与临时授权</text><text class="sub" x="1126" y="554">客户端 SDK 执行单次/分片</text><text class="sub" x="1126" y="577">限定对象、操作与有效期</text><text class="sub" x="1126" y="600">一租户一 bucket</text><text class="sub" x="1126" y="623">未完成分片由存储生命周期回收</text></g><path class="edge " d="M670 175 V220"/><text class="label" x="688" y="200">调用 HTTP 接口</text><path class="edge " d="M670 330 V375"/><text class="label" x="688" y="355">校验归属并编排业务</text><path class="edge " d="M470 525 V575"/><text class="label" x="485" y="552">查询 / 提交事务</text><path class="edge " d="M865 525 V575"/><text class="label" x="880" y="552">签发 / 核验 / 回收</text><path class="edge " d="M645 625 H665 V725 H1088 V365 H1110"/><text class="label" x="1010" y="720">读写主库</text><path class="edge " d="M1030 620 H1110"/><text class="label" x="1042" y="608">调用</text><path class="edge hot" d="M1030 133 H1385 V586 H1360"/><text class="label" x="1135" y="120">客户端直传文件字节</text><path class="edge async" d="M230 300 H310"/><text class="label" x="247" y="286">管理</text><path class="edge async" d="M230 510 H310"/><text class="label" x="238" y="496">评估 / 调度</text><path class="edge async" d="M125 595 V735 H473 V700"/><text class="label" x="230" y="723">领取 / 确认任务</text><text class="sub" x="310" y="790">文件字节直接进入对象存储；发布事务保存 JSON 快照与文件清单。</text><g><rect x="0" y="0" width="1540" height="32" fill="#fff3cd"/><text x="12" y="23" style="fill:#332600;font:17px sans-serif">历史图：已由 2026-10-15 storage 职责拆分设计替代，请勿按此实施。</text></g></svg>