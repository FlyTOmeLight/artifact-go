<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1220 1250" role="img" aria-label="无文件版本核心流程：身份与归属、幂等、编号和保留、数据库原子发布"><title>无文件版本核心流程：身份与归属、幂等、编号和保留、数据库原子发布</title><style>text{font-family:"IBM Plex Sans","Noto Sans SC","PingFang SC",sans-serif;fill:var(--text,#e3ecf5);font-size:17px} .sub{fill:var(--dim,#a9bacb);font-size:14px}.label{fill:var(--dim,#a9bacb);font-size:14px;paint-order:stroke;stroke:var(--bg,#0d1520);stroke-width:6px;stroke-linejoin:round}.box{fill:var(--surface,#132031);stroke:var(--line,#7286a0);stroke-width:1.5}.key{stroke:var(--accent,#ffb547);stroke-width:2.5}.boundary{fill:none;stroke:var(--line,#7286a0);stroke-width:1.5;stroke-dasharray:7 5}.edge{fill:none;stroke:var(--dim,#a9bacb);stroke-width:1.75;marker-end:url(#arrow)}.hot{stroke:var(--accent,#ffb547);stroke-width:2.5}.async{stroke-dasharray:7 5}.bad{stroke:var(--risk,#ff8a7c)}.rail{fill:var(--surface,#132031);stroke:var(--line,#7286a0);stroke-width:1}.node:hover .box,.node:focus .box{stroke:var(--accent,#ffb547);stroke-width:3}.node{outline:none}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="context-stroke"/></marker></defs><rect width="1220" height="1250" fill="var(--bg,#0d1520)"/><rect class="boundary" x="305" y="300" width="445" height="770" rx="4"/><text class="sub" x="321" y="325">数据库事务 · 锁定 Artifact</text><g class="node" tabindex="0"><title>调用 CreateVersion</title><rect class="box" x="335" y="30" width="385" height="85" rx="4"/><text x="351" y="59" font-weight="600">调用 CreateVersion</text><text class="sub" x="351" y="84">requestKey + JSON payload；不传会话 ID</text></g><g class="node" tabindex="0"><title>检查身份、作用域与请求</title><rect class="box" x="335" y="160" width="385" height="90" rx="4"/><text x="351" y="189" font-weight="600">检查身份、作用域与请求</text><text class="sub" x="351" y="214">校验 TenantID / ProjectID / 归属</text></g><g class="node" tabindex="0"><title>锁定集合，查询 CreateRequest</title><rect class="box key" x="335" y="350" width="385" height="85" rx="4"/><text x="351" y="379" font-weight="600">锁定集合，查询 CreateRequest</text><text class="sub" x="351" y="404">同一键必须匹配同一请求指纹</text></g><g class="node" tabindex="0"><title>已有成功结果</title><rect class="box" x="830" y="350" width="350" height="145" rx="4"/><text x="846" y="379" font-weight="600">已有成功结果</text><text class="sub" x="846" y="404">参数一致：返回原版本身份</text><text class="sub" x="846" y="427">版本已隐藏：410 + 原身份</text><text class="sub" x="846" y="450">参数不同：409，不创建版本</text></g><g class="node" tabindex="0"><title>首次发布：校验集合与 alias</title><rect class="box" x="335" y="485" width="385" height="100" rx="4"/><text x="351" y="514" font-weight="600">首次发布：校验集合与 alias</text><text class="sub" x="351" y="539">集合必须 active，检查 expectedRevision</text><text class="sub" x="351" y="562">读取保护与保留规则</text></g><g class="node" tabindex="0"><title>分配编号，评估数量限制</title><rect class="box" x="335" y="635" width="385" height="110" rx="4"/><text x="351" y="664" font-weight="600">分配编号，评估数量限制</text><text class="sub" x="351" y="689">推进 Sequence / Number</text><text class="sub" x="351" y="712">无可用淘汰空间或 reject 超限：回滚</text></g><g class="node" tabindex="0"><title>保存不可变快照</title><rect class="box" x="335" y="795" width="385" height="105" rx="4"/><text x="351" y="824" font-weight="600">保存不可变快照</text><text class="sub" x="351" y="849">Version.ready，按请求设置 Protected</text><text class="sub" x="351" y="872">文件列表为空，不创建上传会话</text></g><g class="node" tabindex="0"><title>原子更新并提交</title><rect class="box key" x="335" y="945" width="385" height="105" rx="4"/><text x="351" y="974" font-weight="600">原子更新并提交</text><text class="sub" x="351" y="999">alias / 计数器 / 保留淘汰 / CreateRequest</text><text class="sub" x="351" y="1022">任一步失败：全部回滚</text></g><g class="node" tabindex="0"><title>返回固定版本引用与快照</title><rect class="box" x="335" y="1120" width="385" height="85" rx="4"/><text x="351" y="1149" font-weight="600">返回固定版本引用与快照</text><text class="sub" x="351" y="1174">响应 files = []；重试不产生新编号</text></g><path class="edge " d="M527 115 V160"/><text class="label" x="544" y="143">提交</text><path class="edge " d="M527 250 V350"/><text class="label" x="544" y="288">开启事务</text><path class="edge " d="M720 394 H830"/><text class="label" x="758" y="381">命中</text><path class="edge " d="M527 435 V485"/><text class="label" x="544" y="466">未命中</text><path class="edge " d="M527 585 V635"/><text class="label" x="544" y="617">继续</text><path class="edge " d="M527 745 V795"/><text class="label" x="544" y="777">检查通过</text><path class="edge " d="M527 900 V945"/><text class="label" x="544" y="927">写入</text><path class="edge " d="M527 1050 V1120"/><text class="label" x="544" y="1094">提交成功</text><g class="node" tabindex="0"><title>后续生命周期</title><rect class="box" x="30" y="635" width="240" height="155" rx="4"/><text x="46" y="664" font-weight="600">后续生命周期</text><text class="sub" x="46" y="689">无文件旧版本可在事务内</text><text class="sub" x="46" y="712">清空内容并保留墓碑</text><text class="sub" x="46" y="735">年龄保留由后台评估</text></g><path class="edge async" d="M335 1000 H290 V735 H270"/><text class="label" x="170" y="1021">执行淘汰</text></svg>