<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1540 2140" role="img" aria-label="带文件版本的 API 调用流程"><title>带文件版本：完整 HTTP 路径、S3 直传及共享发布事务</title><style>text{font-family:"IBM Plex Sans","Noto Sans SC","PingFang SC",sans-serif;fill:var(--text,#e3ecf5);font-size:17px} .sub{fill:var(--dim,#a9bacb);font-size:14px}.label{fill:var(--dim,#a9bacb);font-size:14px;paint-order:stroke;stroke:var(--bg,#0d1520);stroke-width:6px;stroke-linejoin:round}.box{fill:var(--surface,#132031);stroke:var(--line,#7286a0);stroke-width:1.5}.key{stroke:var(--accent,#ffb547);stroke-width:2.5}.boundary{fill:none;stroke:var(--line,#7286a0);stroke-width:1.5;stroke-dasharray:7 5}.edge{fill:none;stroke:var(--dim,#a9bacb);stroke-width:1.75;marker-end:url(#arrow)}.hot{stroke:var(--accent,#ffb547);stroke-width:2.5}.async{stroke-dasharray:7 5}.bad{stroke:var(--risk,#ff8a7c)}.rail{fill:var(--surface,#132031);stroke:var(--line,#7286a0);stroke-width:1}.node:hover .box,.node:focus .box{stroke:var(--accent,#ffb547);stroke-width:3}.node{outline:none}.api{font-family:"IBM Plex Mono",monospace;font-size:14px;fill:var(--text,#e3ecf5)}.step{font-size:17px;font-weight:600}.lifeline{stroke:var(--line,#7286a0);stroke-dasharray:4 6;stroke-width:1}.hint{fill:var(--surface,#132031);stroke:var(--line,#7286a0);stroke-width:1}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="context-stroke"/></marker></defs><rect width="1540" height="2140" fill="var(--bg,#0d1520)"/><g class="node" tabindex="0"><title>客户端：前端 / CLI / artifactv1 SDK</title><rect class="box" x="40" y="35" width="260" height="85" rx="4"/><text class="step" x="56" y="63">客户端</text><text class="sub" x="56" y="88">前端 / CLI / artifactv1 SDK</text></g><g class="node" tabindex="0"><title>artifact-go：登记、核验、封存与发布</title><rect class="box" x="750" y="35" width="260" height="85" rx="4"/><text class="step" x="766" y="63">artifact-go</text><text class="sub" x="766" y="88">登记、核验、封存与发布</text></g><g class="node" tabindex="0"><title>对象存储：S3 数据 API + 临时授权</title><rect class="box" x="1200" y="35" width="290" height="85" rx="4"/><text class="step" x="1216" y="63">对象存储</text><text class="sub" x="1216" y="88">S3 数据 API + 临时授权</text></g><path class="lifeline" d="M170 140 V1860"/><path class="lifeline" d="M880 140 V1860"/><path class="lifeline" d="M1345 140 V1860"/><text class="sub" x="40" y="155">前提：集合已存在；否则先 POST /v1/artifacts 创建集合。</text><text class="step" x="40" y="205">1 · 创建上传会话</text><g><title>POST /v1/artifacts/{artifactID}/uploads</title><text class="api" x="190" y="243">POST /v1/artifacts/{artifactID}/uploads</text><path class="edge" d="M170 267 H880"/></g><text class="sub" x="190" y="295">保存 UploadSession：uploading；返回 sessionID 与 expiresAt。</text><text class="step" x="40" y="380">2 · 逐个登记文件</text><g><title>POST /v1/artifacts/{artifactID}/uploads/{sessionID}/files</title><text class="api" x="190" y="418">POST /v1/artifacts/{artifactID}/uploads/{sessionID}/files</text><path class="edge" d="M170 442 H880"/></g><text class="sub" x="190" y="470">声明logicalPath、size，可选declaredChecksum；返回 fileID，服务生成 ObjectKey。</text><text class="step" x="40" y="555">3 · 取得或续发限权上传凭证</text><g><title>POST /v1/artifacts/{artifactID}/uploads/{sessionID}/files/{fileID}/upload-grant</title><text class="api" x="190" y="593">POST /v1/artifacts/{artifactID}/uploads/{sessionID}/files/{fileID}/upload-grant</text><path class="edge" d="M170 617 H880"/></g><text class="sub" x="190" y="645">会话仍 uploading 且未过期；返回实际 ObjectKey、短期凭证与 S3 连接参数。</text><path class="edge async" d="M880 725 H1345"/><text class="sub" x="920" y="712">服务端调用临时授权后端</text><text class="step" x="40" y="795">4 · 客户端直接调用 S3 上传</text><g><title>S3 PutObject 或 CreateMultipartUpload → UploadPart → CompleteMultipartUpload</title><text class="api" x="190" y="833">S3 PutObject 或 CreateMultipartUpload → UploadPart → CompleteMultipartUpload</text><path class="edge" d="M170 857 H1345"/></g><text class="sub" x="190" y="885">客户端 SDK 负责切分、并发与重试；artifact-go 不接收上传字节或管理分片。</text><text class="sub" x="190" y="908">上传限租户 bucket；发布后对象修改由客户端负责。</text><text class="step" x="40" y="980">5 · 通知完成并核验每个文件</text><g><title>POST /v1/artifacts/{artifactID}/uploads/{sessionID}/files/{fileID}/complete</title><text class="api" x="190" y="1018">POST /v1/artifacts/{artifactID}/uploads/{sessionID}/files/{fileID}/complete</text><path class="edge" d="M170 1042 H880"/></g><text class="sub" x="190" y="1070">artifact-go 在事务外查询对象，确认对象存在与实际大小，摘要由客户端声明；通过后文件为 ready。</text><path class="edge async" d="M880 1135 H1345"/><text class="sub" x="920" y="1122">BlobStore.Stat → S3 HeadObject</text><text class="step" x="40" y="1205">6 · 所有文件就绪后封存清单</text><g><title>POST /v1/artifacts/{artifactID}/uploads/{sessionID}/seal</title><text class="api" x="190" y="1243">POST /v1/artifacts/{artifactID}/uploads/{sessionID}/seal</text><path class="edge" d="M170 1267 H880"/></g><text class="sub" x="190" y="1295">同一短事务锁定会话、检查 uploading / 未过期 / 所有文件 ready，再转换为 sealed。</text><text class="step" x="40" y="1380">7 · 发布带文件版本</text><g><title>POST /v1/artifacts/{artifactID}/versions</title><text class="api" x="190" y="1418">POST /v1/artifacts/{artifactID}/versions</text><path class="edge" d="M170 1442 H880"/></g><text class="sub" x="190" y="1470">请求包含 requestKey、uploadSessionID，可附 payload、protected 与 alias 条件。</text><text class="sub" x="190" y="1493">共用发布事务：先锁 Artifact、检查幂等，再锁会话；绑定文件并改为 consumed。</text><text class="sub" x="190" y="1516">编号、快照、alias、保护、保留淘汰及去重结果原子提交；失败全部回滚。</text><path class="edge" d="M880 1608 H170"/><text class="sub" x="190" y="1594">提交后返回固定 versionUri、fileUri 与文件清单；幂等命中不再次发布。</text><text class="step" x="40" y="1680">8 · 按需下载已发布文件</text><g><title>GET /v1/artifacts/{artifactID}/versions/{versionID}/files/{fileID}/content</title><text class="api" x="190" y="1718">GET /v1/artifacts/{artifactID}/versions/{versionID}/files/{fileID}/content</text><path class="edge" d="M170 1742 H880"/></g><text class="sub" x="190" y="1770">先检查作用域与版本 ready，再代理下载；调用方关闭返回的文件流。</text><g class="node" tabindex="0"><title>中止与回收：DELETE /v1/artifacts/{artifactID}/uploads/{sessionID}：中止会话，完整对象由后台任务回收。；S3 AbortMultipartUpload：客户端中止未完成分片；客户端退出后由存储生命周期清理遗留分片。；确认失败不直接删除共用 ObjectKey；会话终止或版本逻辑删除后，artifact-go 才回收完整对象。；上传步骤 2 至 5 对每个文件执行；SDK 方法和请求、响应 struct 见设计文档。</title><rect class="box" x="40" y="1910" width="1450" height="190" rx="4"/><text class="step" x="56" y="1938">中止与回收</text><text class="sub" x="56" y="1963">DELETE /v1/artifacts/{artifactID}/uploads/{sessionID}：中止会话，完整对象由后台任务回收。</text><text class="sub" x="56" y="1985">S3 AbortMultipartUpload：客户端中止未完成分片；客户端退出后由存储生命周期清理遗留分片。</text><text class="sub" x="56" y="2007">确认失败不直接删除共用 ObjectKey；会话终止或版本逻辑删除后，artifact-go 才回收完整对象。</text><text class="sub" x="56" y="2029">上传步骤 2 至 5 对每个文件执行；SDK 方法和请求、响应 struct 见设计文档。</text></g><g><rect x="0" y="0" width="1540" height="32" fill="#fff3cd"/><text x="12" y="23" style="fill:#332600;font:17px sans-serif">历史图：已由 2026-10-15 storage 职责拆分设计替代，请勿按此实施。</text></g></svg>