basePath: /
definitions:
  artifactv1.AliasResponse:
    properties:
      artifactID:
        type: string
      deletedAt:
        type: string
      name:
        type: string
      revision:
        type: integer
      target:
        $ref: '#/definitions/artifactv1.VersionIdentity'
    type: object
  artifactv1.AliasUpdate:
    properties:
      expectedRevision:
        minimum: 0
        type: integer
      name:
        maxLength: 64
        type: string
    required:
    - expectedRevision
    - name
    type: object
  artifactv1.ArtifactResponse:
    properties:
      artifactUri:
        type: string
      createdAt:
        type: string
      createdBy:
        type: string
      id:
        type: string
      initialVersion:
        type: string
      name:
        type: string
      projectID:
        type: string
      retentionPolicy:
        $ref: '#/definitions/artifactv1.RetentionResponse'
      state:
        type: string
      tenantID:
        type: string
      type:
        type: string
      updatedAt:
        type: string
      userID:
        type: string
      versionScheme:
        type: string
    type: object
  artifactv1.CreateArtifactRequest:
    properties:
      initialVersion:
        maxLength: 64
        type: string
      name:
        example: demo
        maxLength: 128
        type: string
      projectID:
        maxLength: 64
        type: string
      requestKey:
        maxLength: 64
        type: string
      type:
        example: model
        maxLength: 64
        minLength: 1
        type: string
      versionScheme:
        enum:
        - integer
        - semver
        example: integer
        type: string
    required:
    - name
    - type
    - versionScheme
    type: object
  artifactv1.CreateDraftRequest:
    properties:
      annotations:
        type: object
      files:
        items:
          $ref: '#/definitions/artifactv1.FileReference'
        type: array
      payload:
        type: object
      requestKey:
        maxLength: 64
        type: string
      sourceVersionID:
        type: string
    required:
    - requestKey
    type: object
  artifactv1.CreateVersionRequest:
    properties:
      aliases:
        items:
          $ref: '#/definitions/artifactv1.AliasUpdate'
        type: array
      annotations:
        type: object
      bump:
        enum:
        - major
        - minor
        - patch
        type: string
      draftID:
        type: string
      expectedDraftRevision:
        type: integer
      files:
        items:
          $ref: '#/definitions/artifactv1.FileReference'
        type: array
      payload:
        type: object
      protected:
        type: boolean
      requestKey:
        maxLength: 64
        type: string
    required:
    - requestKey
    type: object
  artifactv1.DeleteVersionResponse:
    properties:
      artifactID:
        type: string
      id:
        type: string
      sequence:
        type: integer
      state:
        type: string
      version:
        type: string
      versionUri:
        type: string
    type: object
  artifactv1.DraftDeletedResponse:
    properties:
      appliedRevision:
        type: integer
      code:
        description: Code 错误码
        type: string
      draft:
        $ref: '#/definitions/artifactv1.DraftIdentity'
      message:
        description: Message 详细错误信息
        type: string
      requestId:
        description: RequestID 请求id，接收到请求的时候由中间件自动注入
        type: string
      statusCode:
        description: StatusCode 状态码，推荐6位数字
        type: integer
    type: object
  artifactv1.DraftIdentity:
    properties:
      artifactID:
        type: string
      id:
        type: string
    type: object
  artifactv1.DraftResponse:
    properties:
      annotations:
        type: object
      artifactID:
        type: string
      createdAt:
        type: string
      files:
        items:
          $ref: '#/definitions/artifactv1.FileResponse'
        type: array
      id:
        type: string
      payload:
        type: object
      revision:
        type: integer
      updatedAt:
        type: string
    type: object
  artifactv1.DraftSummary:
    properties:
      artifactID:
        type: string
      createdAt:
        type: string
      id:
        type: string
      revision:
        type: integer
      updatedAt:
        type: string
    type: object
  artifactv1.ErrorResponse:
    properties:
      code:
        description: Code 错误码
        type: string
      message:
        description: Message 详细错误信息
        type: string
      requestId:
        description: RequestID 请求id，接收到请求的时候由中间件自动注入
        type: string
      statusCode:
        description: StatusCode 状态码，推荐6位数字
        type: integer
    type: object
  artifactv1.FileChecksum:
    properties:
      algorithm:
        type: string
      type:
        type: string
      value:
        type: string
    type: object
  artifactv1.FileReference:
    properties:
      fileID:
        type: string
      path:
        maxLength: 512
        type: string
    required:
    - fileID
    - path
    type: object
  artifactv1.FileResponse:
    properties:
      contentType:
        type: string
      declaredChecksum:
        $ref: '#/definitions/artifactv1.FileChecksum'
      fileID:
        type: string
      fileUri:
        type: string
      path:
        type: string
      size:
        type: integer
    type: object
  artifactv1.ListArtifactsResponse:
    properties:
      items:
        items:
          $ref: '#/definitions/artifactv1.ArtifactResponse'
        type: array
      nextCursor:
        type: string
    type: object
  artifactv1.ListDraftsResponse:
    properties:
      items:
        items:
          $ref: '#/definitions/artifactv1.DraftSummary'
        type: array
      nextCursor:
        type: string
    type: object
  artifactv1.ListVersionsResponse:
    properties:
      items:
        items:
          $ref: '#/definitions/artifactv1.VersionResponse'
        type: array
      nextCursor:
        type: string
    type: object
  artifactv1.PreviewRetentionResponse:
    properties:
      blocked:
        type: boolean
      blockingReasons:
        items:
          type: string
        type: array
      calculatedAt:
        type: string
      candidates:
        items:
          $ref: '#/definitions/artifactv1.RetentionDecision'
        type: array
      policyRevision:
        type: integer
      retained:
        items:
          $ref: '#/definitions/artifactv1.RetentionDecision'
        type: array
    type: object
  artifactv1.PutAliasRequest:
    properties:
      expectedRevision:
        minimum: 0
        type: integer
      versionID:
        type: string
    required:
    - expectedRevision
    - versionID
    type: object
  artifactv1.ResolveRequest:
    properties:
      uri:
        type: string
    required:
    - uri
    type: object
  artifactv1.ResolveResponse:
    properties:
      artifact:
        $ref: '#/definitions/artifactv1.ArtifactResponse'
      file:
        $ref: '#/definitions/artifactv1.FileResponse'
      version:
        $ref: '#/definitions/artifactv1.VersionResponse'
    type: object
  artifactv1.RetentionDecision:
    properties:
      reasons:
        items:
          type: string
        type: array
      version:
        $ref: '#/definitions/artifactv1.VersionIdentity'
    type: object
  artifactv1.RetentionResponse:
    properties:
      artifactID:
        type: string
      enabled:
        type: boolean
      maxAgeSeconds:
        type: integer
      maxVersions:
        type: integer
      minVersions:
        type: integer
      overflowAction:
        type: string
      protectAliases:
        type: boolean
      revision:
        type: integer
      updatedAt:
        type: string
    type: object
  artifactv1.UpdateAnnotationsRequest:
    properties:
      annotations:
        type: object
      expectedRevision:
        minimum: 0
        type: integer
    required:
    - annotations
    - expectedRevision
    type: object
  artifactv1.UpdateDraftRequest:
    properties:
      annotations:
        type: object
      expectedRevision:
        type: integer
      files:
        items:
          $ref: '#/definitions/artifactv1.FileReference'
        type: array
      payload:
        type: object
      requestKey:
        maxLength: 64
        type: string
    required:
    - expectedRevision
    - requestKey
    type: object
  artifactv1.UpdateDraftResponse:
    properties:
      appliedRevision:
        type: integer
      draft:
        $ref: '#/definitions/artifactv1.DraftResponse'
    type: object
  artifactv1.UpdateProtectionRequest:
    properties:
      expectedRevision:
        minimum: 0
        type: integer
      protected:
        type: boolean
    required:
    - expectedRevision
    - protected
    type: object
  artifactv1.UpdateRetentionRequest:
    properties:
      enabled:
        type: boolean
      expectedRevision:
        minimum: 0
        type: integer
      maxAgeSeconds:
        type: integer
      maxVersions:
        type: integer
      minVersions:
        minimum: 0
        type: integer
      overflowAction:
        enum:
        - reject
        - deleteOldest
        type: string
      protectAliases:
        type: boolean
    required:
    - enabled
    - expectedRevision
    - minVersions
    - overflowAction
    - protectAliases
    type: object
  artifactv1.VersionDeletedResponse:
    properties:
      code:
        description: Code 错误码
        type: string
      message:
        description: Message 详细错误信息
        type: string
      requestId:
        description: RequestID 请求id，接收到请求的时候由中间件自动注入
        type: string
      statusCode:
        description: StatusCode 状态码，推荐6位数字
        type: integer
      version:
        $ref: '#/definitions/artifactv1.VersionIdentity'
    type: object
  artifactv1.VersionIdentity:
    properties:
      artifactID:
        type: string
      id:
        type: string
      sequence:
        type: integer
      version:
        type: string
      versionUri:
        type: string
    type: object
  artifactv1.VersionResponse:
    properties:
      annotations:
        type: object
      artifactID:
        type: string
      createdBy:
        type: string
      files:
        items:
          $ref: '#/definitions/artifactv1.FileResponse'
        type: array
      id:
        type: string
      payload:
        type: object
      protected:
        type: boolean
      publishedAt:
        type: string
      revision:
        type: integer
      sequence:
        type: integer
      state:
        type: string
      version:
        type: string
      versionUri:
        type: string
    type: object
  errors.Error:
    properties:
      code:
        description: Code 错误码
        type: string
      message:
        description: Message 详细错误信息
        type: string
      requestId:
        description: RequestID 请求id，接收到请求的时候由中间件自动注入
        type: string
      statusCode:
        description: StatusCode 状态码，推荐6位数字
        type: integer
    type: object
  storagev1.CompleteFileResult:
    properties:
      contentType:
        type: string
      createdAt:
        type: string
      createdBy:
        type: string
      declaredChecksum:
        $ref: '#/definitions/storagev1.FileChecksum'
      error:
        $ref: '#/definitions/storagev1.FileError'
      expectedSize:
        type: integer
      expiresAt:
        type: string
      fileID:
        type: string
      size:
        type: integer
      state:
        type: string
      userID:
        type: string
    type: object
  storagev1.CreateGrantRequest:
    properties:
      fileIDs:
        items:
          type: string
        maxItems: 1000
        minItems: 1
        type: array
      scope:
        $ref: '#/definitions/storagev1.GrantScope'
      ttlSeconds:
        type: integer
    required:
    - fileIDs
    type: object
  storagev1.CreateTenantBucketRequest:
    properties:
      tenantID:
        type: string
    required:
    - tenantID
    type: object
  storagev1.FileChecksum:
    properties:
      algorithm:
        type: string
      type:
        type: string
      value:
        type: string
    type: object
  storagev1.FileError:
    properties:
      code:
        type: string
      message:
        type: string
      status:
        type: integer
    type: object
  storagev1.FileResponse:
    properties:
      contentType:
        type: string
      createdAt:
        type: string
      createdBy:
        type: string
      declaredChecksum:
        $ref: '#/definitions/storagev1.FileChecksum'
      expectedSize:
        type: integer
      expiresAt:
        type: string
      fileID:
        type: string
      size:
        type: integer
      state:
        type: string
      userID:
        type: string
    type: object
  storagev1.GrantCredentials:
    properties:
      accessKeyID:
        type: string
      secretAccessKey:
        type: string
      sessionToken:
        type: string
    type: object
  storagev1.GrantFile:
    properties:
      bucket:
        type: string
      fileID:
        type: string
      objectKey:
        type: string
    type: object
  storagev1.GrantResponse:
    properties:
      actions:
        items:
          type: string
        type: array
      credentials:
        $ref: '#/definitions/storagev1.GrantCredentials'
      endpoint:
        type: string
      expiresAt:
        type: string
      files:
        items:
          $ref: '#/definitions/storagev1.GrantFile'
        type: array
      forcePathStyle:
        type: boolean
      region:
        type: string
    type: object
  storagev1.GrantScope:
    properties:
      actions:
        items:
          type: string
        type: array
      preset:
        type: string
    type: object
  storagev1.RegisterFileItem:
    properties:
      contentType:
        type: string
      declaredChecksum:
        $ref: '#/definitions/storagev1.FileChecksum'
      requestKey:
        type: string
      size:
        type: integer
    type: object
  storagev1.RegisterFileResult:
    properties:
      contentType:
        type: string
      createdAt:
        type: string
      createdBy:
        type: string
      declaredChecksum:
        $ref: '#/definitions/storagev1.FileChecksum'
      error:
        $ref: '#/definitions/storagev1.FileError'
      expectedSize:
        type: integer
      expiresAt:
        type: string
      fileID:
        type: string
      requestKey:
        type: string
      size:
        type: integer
      state:
        type: string
      userID:
        type: string
    type: object
  storagev1.TenantBucketResponse:
    properties:
      backendID:
        type: string
      bucket:
        type: string
      tenantID:
        type: string
    type: object
info:
  contact: {}
  description: Collections, JSON versions and drafts, aliases, conditional management
    and retention. Scope headers select a scope verified by the injected identity
    resolver.
  title: Artifact API
  version: 0.1.0
paths:
  /v1/artifacts:
    get:
      parameters:
      - description: Tenant scope selection
        in: header
        name: x-forge-tenant-id
        required: true
        type: string
      - description: Project scope selection; omit for tenant scope
        in: header
        name: x-forge-project-id
        type: string
      - description: Resource owner selection; omit for shared scope, verified by
          resolver
        in: header
        name: X-Resource-User-ID
        type: string
      - description: Request correlation ID
        in: header
        name: X-Request-ID
        type: string
      - description: Artifact type
        in: query
        name: type
        type: string
      - description: State
        enum:
        - active
        - archived
        in: query
        name: state
        type: string
      - description: Query-bound cursor
        in: query
        name: cursor
        type: string
      - default: 50
        description: Page size
        in: query
        maximum: 200
        minimum: 1
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/artifactv1.ListArtifactsResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/artifactv1.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/artifactv1.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/artifactv1.ErrorResponse'
      security:
      - BearerAuth: []
      summary: List collections in the exact request scope
      tags:
      - artifacts
    post:
      consumes:
      - application/json
      parameters:
      - description: Tenant scope selection
        in: header
        name: x-forge-tenant-id
        required: true
        type: string
      - description: Project scope selection; omit for tenant scope
        in: header
        name: x-forge-project-id
        type: string
      - description: Resource owner selection; omit for shared scope, verified by
          resolver
        in: header
        name: X-Resource-User-ID
        type: string
      - description: Request correlation ID
        in: header
        name: X-Request-ID
        type: string
      - description: Collection
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/artifactv1.CreateArtifactRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Successful replay with current collection state
          schema:
            $ref: '#/definitions/artifactv1.ArtifactResponse'
        "201":
          description: Created
          schema:
            $ref: '#/definitions/artifactv1.ArtifactResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/artifactv1.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/artifactv1.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/artifactv1.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/artifactv1.ErrorResponse'
        "413":
          description: Request Entity Too Large
          schema:
            $ref: '#/definitions/artifactv1.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/artifactv1.ErrorResponse'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/artifactv1.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Create an artifact collection
      tags:
      - artifacts
  /v1/artifacts/{artifactID}:
    get:
      parameters:
      - description: Tenant scope selection
        in: header
        name: x-forge-tenant-id
        required: true
        type: string
      - description: Project scope selection; omit for tenant scope
        in: header
        name: x-forge-project-id
        type: string
      - description: Resource owner selection; omit for shared scope, verified by
          resolver
        in: header
        name: X-Resource-User-ID
        type: string
      - description: Request correlation ID
        in: header
        name: X-Request-ID
        type: string
      - description: Artifact ID
        in: path
        name: artifactID
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/artifactv1.ArtifactResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/artifactv1.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/artifactv1.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/artifactv1.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/artifactv1.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Read a collection, including archived collections
      tags:
      - artifacts
  /v1/artifacts/{artifactID}/aliases/{name}:
    delete:
      parameters:
      - description: Tenant scope selection
        in: header
        name: x-forge-tenant-id
        required: true
        type: string
      - description: Project scope selection
        in: header
        name: x-forge-project-id
        type: string
      - description: Resource owner selection; omit for shared scope, verified by
          resolver
        in: header
        name: X-Resource-User-ID
        type: string
      - description: Artifact ID
        in: path
        name: artifactID
        required: true
        type: string
      - description: Alias name; latest is read-only
        in: path
        name: name
        required: true
        type: string
      - description: Current alias revision
        in: query
        minimum: 0
        name: expectedRevision
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/artifactv1.AliasResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/artifactv1.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/artifactv1.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/artifactv1.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/artifactv1.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/artifactv1.ErrorResponse'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/artifactv1.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Conditionally delete an alias and retain its revision tombstone
      tags:
      - aliases
    get:
      parameters:
      - description: Tenant scope selection
        in: header
        name: x-forge-tenant-id
        required: true
        type: string
      - description: Project scope selection
        in: header
        name: x-forge-project-id
        type: string
      - description: Resource owner selection; omit for shared scope, verified by
          resolver
        in: header
        name: X-Resource-User-ID
        type: string
      - description: Artifact ID
        in: path
        name: artifactID
        required: true
        type: string
      - description: Alias name
        in: path
        name: name
        required: true
        type: string
      - default: false
        description: Include alias tombstone
        in: query
        name: includeDeleted
        type: boolean
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/artifactv1.AliasResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/artifactv1.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/artifactv1.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/artifactv1.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/artifactv1.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Read an alias or the current latest ready version
      tags:
      - aliases
    put:
      consumes:
      - application/json
      parameters:
      - description: Tenant scope selection
        in: header
        name: x-forge-tenant-id
        required: true
        type: string
      - description: Project scope selection
        in: header
        name: x-forge-project-id
        type: string
      - description: Resource owner selection; omit for shared scope, verified by
          resolver
        in: header
        name: X-Resource-User-ID
        type: string
      - description: Artifact ID
        in: path
        name: artifactID
        required: true
        type: string
      - description: Alias name; latest is read-only
        in: path
        name: name
        required: true
        type: string
      - description: Target and current alias revision
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/artifactv1.PutAliasRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/artifactv1.AliasResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/artifactv1.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/artifactv1.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/artifactv1.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/artifactv1.ErrorResponse'
        "413":
          description: Request Entity Too Large
          schema:
            $ref: '#/definitions/artifactv1.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/artifactv1.ErrorResponse'
