# Optional Forge entrypoint: bin/artifact-forge-server.
# StorageConsumerID = "artifact" # Stable persisted reference owner; set with StorageDB.
AppName = "artifact-go"
AppCode = 100
RunMode = "release"

[HTTPServer]
# Enable only behind an operations-only ingress for /metrics.
MetricsEnable = false
Listen = "${env: ARTIFACT_LISTEN:127.0.0.1:18080}"
ReadTimeout = 10000
WriteTimeout = 10000
IdleTimeout = 60000

[DB]
Driver = "PostgreSQL"
DSN = "${env: ARTIFACT_DATABASE_URL}"
MaxIdleConns = 5
MaxOpenConns = 10
ConnMaxIdleTime = 60
ConnMaxLifeTime = 300
AutoMigrate = false

[Version]
MaxFilesPerVersion = 1000
MaxPayloadBytes = 262144
MaxAnnotationsBytes = 65536
MaxRequestBodyBytes = 8388608

[Worker]
Concurrency = 2
ScanInterval = "5s"
LeaseDuration = "60s"
RenewInterval = "15s"
MaxFailures = 20

# Enable only with service.BuildWithVerifiers and a trusted tenant-system verifier.
# [Storage]
# BackendID = "juicefs-local"
# Endpoint = "${env: ARTIFACT_STORAGE_ENDPOINT}"
# Region = "us-east-1"
# AccessKeyID = "${env: ARTIFACT_STORAGE_ACCESS_KEY_ID}"
# SecretAccessKey = "${env: ARTIFACT_STORAGE_SECRET_ACCESS_KEY}"
# UsePathStyle = true

