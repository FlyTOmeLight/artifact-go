{
  "image": {
    "repository": "artifact-go",
    "tag": "forge-storage-app-20261017",
    "pullPolicy": "Never"
  },
  "existingSecret": "artifact-runtime-credentials",
  "tlsSecret": "artifact-integration-tls",
  "config": {
    "AppName": "artifact-forge",
    "AppCode": 100,
    "RunMode": "release",
    "HTTPServer": {
      "Listen": "0.0.0.0:18080",
      "ReadTimeout": 10000,
      "WriteTimeout": 30000
    },
    "DB": {
      "Driver": "PostgreSQL",
      "DSN": "${env:ARTIFACT_DATABASE_URL}",
      "AutoMigrate": false
    },
    "StorageDB": {
      "Driver": "PostgreSQL",
      "DSN": "${env:STORAGE_DATABASE_URL}",
      "AutoMigrate": false
    },
    "Storage": {
      "BackendID": "juicefs-orbstack",
      "Endpoint": "http://127.0.0.1:19010",
      "Region": "us-east-1",
      "AccessKeyID": "${env:S3_ACCESS_KEY_ID}",
      "SecretAccessKey": "${env:S3_SECRET_ACCESS_KEY}",
      "UsePathStyle": true,
      "GrantIssuer": {
        "Endpoint": "http://127.0.0.1:19010",
        "AccessKeyID": "${env:STS_ACCESS_KEY_ID}",
        "SecretAccessKey": "${env:STS_SECRET_ACCESS_KEY}"
      }
    },
    "StorageGrants": {
      "UploadTTL": "16m",
      "ReadTTL": "16m",
      "AllowedActions": [
        "s3:PutObject",
        "s3:GetObject",
        "s3:ListMultipartUploadParts",
        "s3:AbortMultipartUpload"
      ]
    },
    "ForgeTenant": {
      "Endpoint": "https://forge-tenant.forge-tenant-split.svc.cluster.local:8443",
      "ServiceToken": "${env:TENANT_SERVICE_TOKEN}"
    },
    "TenantManagement": {
      "Tokens": [
        "${env:TENANT_MANAGEMENT_TOKEN}"
      ]
    },
    "StorageConsumerID": "artifact-orbstack"
  },
  "nginxConfig": "pid /tmp/nginx.pid; events {} http { access_log off; error_log /dev/stderr warn; client_body_temp_path /tmp/client; proxy_temp_path /tmp/proxy; fastcgi_temp_path /tmp/fastcgi; uwsgi_temp_path /tmp/uwsgi; scgi_temp_path /tmp/scgi; server { listen 8443 ssl; ssl_certificate /tls/artifact.crt; ssl_certificate_key /tls/artifact.key; client_max_body_size 8m; location / { proxy_pass http://127.0.0.1:18080; proxy_set_header Host $http_host; proxy_read_timeout 60s; } } server { listen 19010; client_max_body_size 0; location / { proxy_pass http://juicefs.artifact-storage.svc.cluster.local:9000; proxy_set_header Host $http_host; proxy_request_buffering off; proxy_read_timeout 3600s; } } }\n",
  "postgres": {
    "existingSecret": "artifact-integration-db",
    "initSecret": "artifact-integration-db-init",
    "existingClaim": "artifact-integration-db"
  }
}
