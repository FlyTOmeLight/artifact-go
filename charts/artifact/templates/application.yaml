apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "artifact.fullname" . }}
spec:
  replicas: 1
  {{- if .Values.initialization.enabled }}
  strategy: {type: Recreate}
  {{- end }}
  selector:
    matchLabels:
      app: {{ include "artifact.fullname" . }}
  template:
    metadata:
      labels:
        app: {{ include "artifact.fullname" . }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 45
      {{- if .Values.initialization.enabled }}
      initContainers:
        - name: migrate
          image: {{ printf "%s:%s" .Values.image.repository (required "image.tag is required" .Values.image.tag) | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: [/usr/local/bin/artifact-migrate]
          args: ["--config=/config/config.json", {{ printf "--timeout=%s" .Values.initialization.timeout | quote }}]
          envFrom:
            - secretRef: {name: {{ include "artifact.secret" . }}}
          volumeMounts:
            - {name: config, mountPath: /config, readOnly: true}
        {{- if include "artifact.forgeEnabled" . }}
        - name: storage-iam
          image: {{ printf "%s:%s" .Values.initialization.storageImage.repository (required "initialization.storageImage.tag is required" .Values.initialization.storageImage.tag) | quote }}
          imagePullPolicy: {{ .Values.initialization.storageImage.pullPolicy }}
          command: [/usr/local/bin/artifact-storage-bootstrap]
          args:
            - {{ printf "--endpoint=http://%s-juicefs:9000" .Release.Name | quote }}
            - {{ printf "--owner=%s-%s" .Release.Namespace .Release.Name | quote }}
            - {{ printf "--timeout=%s" .Values.initialization.timeout | quote }}
          envFrom:
            - secretRef: {name: {{ include "artifact.secret" . }}}
        {{- end }}
      {{- end }}
      containers:
        - name: api
          image: {{ printf "%s:%s" .Values.image.repository (required "image.tag is required" .Values.image.tag) | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: [/usr/local/bin/artifact-forge-server]
          env:
            - name: SERVER_CONFIG_PATH
              value: /config/config.json
            - name: SSL_CERT_FILE
              value: /tls/ca.crt
          envFrom:
            - secretRef:
                name: {{ include "artifact.secret" . }}
          ports:
            - containerPort: 18080
          readinessProbe:
            tcpSocket:
              port: 18080
            initialDelaySeconds: 3
          # Keep serving while Service endpoint removal reaches the data plane.
          lifecycle:
            preStop:
              sleep:
                seconds: 10
          volumeMounts:
            - name: config
              mountPath: /config
              readOnly: true
            - name: integration-tls
              mountPath: /tls
              readOnly: true
        - name: integration-tls
          image: {{ .Values.proxyImage | quote }}
          command: [nginx, -c, /config/nginx.conf, -g, "daemon off;"]
          lifecycle:
            preStop:
              sleep:
                seconds: 10
          ports:
            - name: internal-tls
              containerPort: 8443
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            runAsNonRoot: true
            runAsUser: 101
          volumeMounts:
            - name: integration-tls
              mountPath: /tls
              readOnly: true
            - name: integration-nginx
              mountPath: /config
              readOnly: true
            - name: integration-tmp
              mountPath: /tmp
            - name: integration-cache
              mountPath: /var/cache/nginx
      volumes:
        - name: config
          configMap:
            name: {{ include "artifact.fullname" . }}-runtime
        - name: integration-tls
          secret:
            secretName: {{ include "artifact.tlsSecret" . }}
            items:
              - {key: ca.crt, path: ca.crt}
              - {key: artifact.crt, path: artifact.crt}
              - {key: artifact.key, path: artifact.key}
        - name: integration-nginx
          configMap:
            name: {{ include "artifact.fullname" . }}-integration-nginx
        - name: integration-tmp
          emptyDir: {}
        - name: integration-cache
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "artifact.fullname" . }}
spec:
  selector:
    app: {{ include "artifact.fullname" . }}
  ports:
    - name: http
      port: 80
      targetPort: 18080
    - name: internal-tls
      port: 8443
      targetPort: 8443
