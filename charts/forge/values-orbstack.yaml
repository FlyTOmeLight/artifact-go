# Public settings only. Supply the external CA and bootstrap authorization separately.
global:
  forge:
    publicURL: http://127.0.0.1:8483
    # Artifact's local S3 proxy preserves this Host for signing; clients use a port-forward.
    storageEndpoint: http://127.0.0.1:19010
    external:
      casdoorURL: http://casdoor.tenant-lab.svc.cluster.local:8000
      issuer: https://identity.tenant-lab.svc.cluster.local:8080
      organization: lab-identities
      certificate: cert-built-in
      gitlabURL: http://gitlab-webservice-default.tenant-lab.svc.cluster.local:8181
      gitlabPublicURL: http://127.0.0.1:18080
      gitlabOIDCClientID: tenant-lab-gitlab
    bootstrap:
      username: forge-helm-admin
      email: forge-helm-admin@example.test
      gitlabTokenExpiresAt: "2027-10-19"
artifact:
  image:
    tag: forge-review-20261022
    pullPolicy: Never
  initialization:
    storageImage:
      tag: helm-init-20261020
      pullPolicy: Never
tenant:
  image:
    tag: forge-review-20261022
    pullPolicy: Never
web:
  image:
    tag: forge-review-20261022
    pullPolicy: Never
juicefs:
  image:
    pullPolicy: Never
