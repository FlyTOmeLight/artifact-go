{{- $name := printf "%s-tls" .Release.Name -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name -}}
{{- $data := dict -}}
{{- if $existing -}}
  {{- range $key := list "ca.crt" "internal-ca.crt" "artifact.crt" "artifact.key" "tenant.crt" "tenant.key" -}}
    {{- $_ := set $data $key (required (printf "existing TLS Secret is missing %s" $key) (index $existing.data $key)) -}}
  {{- end -}}
{{- else -}}
  {{- if .Release.IsUpgrade -}}{{- fail "existing Forge TLS Secret is missing; restore it before upgrading" -}}{{- end -}}
  {{- $ca := genCA (printf "%s.%s" .Release.Name .Release.Namespace) 3650 -}}
  {{- $_ := set $data "internal-ca.crt" ($ca.Cert | b64enc) -}}
  {{- $external := .Values.global.forge.external.caPEM -}}
  {{- if .Values.global.forge.external.caSecret -}}
    {{- $externalSecret := lookup "v1" "Secret" .Release.Namespace .Values.global.forge.external.caSecret -}}
    {{- if $externalSecret -}}
      {{- $external = required "external issuer CA Secret is missing ca.crt" (index $externalSecret.data "ca.crt" | b64dec) -}}
    {{- else -}}
      {{- $external = required "global.forge.external.caPEM is required for offline rendering" .Values.global.forge.external.caPEM -}}
    {{- end -}}
  {{- else -}}
    {{- $external = required "global.forge.external.caPEM or caSecret is required" $external -}}
  {{- end -}}
  {{- $_ := set $data "ca.crt" (printf "%s\n%s" $ca.Cert $external | b64enc) -}}
  {{- range $component := list "artifact" "tenant" -}}
    {{- $host := printf "%s-%s" $.Release.Name $component -}}
    {{- $dns := list $host (printf "%s.%s" $host $.Release.Namespace) (printf "%s.%s.svc" $host $.Release.Namespace) (printf "%s.%s.svc.cluster.local" $host $.Release.Namespace) -}}
    {{- $cert := genSignedCert $host nil $dns 365 $ca -}}
    {{- $_ := set $data (printf "%s.crt" $component) ($cert.Cert | b64enc) -}}
    {{- $_ := set $data (printf "%s.key" $component) ($cert.Key | b64enc) -}}
  {{- end -}}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  {{- include "forge.secretMetadata" . | nindent 2 }}
type: Opaque
data:
  {{- $data | toYaml | nindent 2 }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-web-trust
data:
  ca-certificates.crt: |
    {{- index $data "ca.crt" | b64dec | nindent 4 }}
---
{{- if not .Values.global.forge.external.caSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-external-ca
  {{- include "forge.secretMetadata" . | nindent 2 }}
type: Opaque
stringData:
  ca.crt: {{ required "global.forge.external.caPEM or caSecret is required" .Values.global.forge.external.caPEM | quote }}
{{- end }}
