{{- include "forge.seed" . -}}
{{- $s := .forgeSeed -}}
{{- $f := .Values.global.forge -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-seed
  {{- include "forge.secretMetadata" . | nindent 2 }}
type: Opaque
data:
  {{- range $key, $value := $s }}
  {{ $key }}: {{ $value | b64enc | quote }}
  {{- end }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-artifact-db
  {{- include "forge.secretMetadata" . | nindent 2 }}
type: Opaque
stringData:
  POSTGRES_PASSWORD: {{ index $s "artifact-admin-password" | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-artifact-db-init
  {{- include "forge.secretMetadata" . | nindent 2 }}
type: Opaque
stringData:
  01-databases.sql: |
    CREATE USER artifact_app WITH PASSWORD '{{ index $s "artifact-password" }}';
    CREATE USER storage_app WITH PASSWORD '{{ index $s "storage-password" }}';
    CREATE DATABASE artifact OWNER artifact_app;
    CREATE DATABASE storage OWNER storage_app;
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-artifact-env
  {{- include "forge.secretMetadata" . | nindent 2 }}
type: Opaque
stringData:
  ARTIFACT_DATABASE_URL: {{ printf "postgres://artifact_app:%s@%s-artifact-postgres:5432/artifact?sslmode=disable" (index $s "artifact-password") .Release.Name | quote }}
  STORAGE_DATABASE_URL: {{ printf "postgres://storage_app:%s@%s-artifact-postgres:5432/storage?sslmode=disable" (index $s "storage-password") .Release.Name | quote }}
  TENANT_SERVICE_TOKEN: {{ index $s "tenant-service-key" | quote }}
  TENANT_MANAGEMENT_TOKEN: {{ index $s "storage-management-token" | quote }}
  S3_ACCESS_KEY_ID: {{ index $s "s3-user" | quote }}
  S3_SECRET_ACCESS_KEY: {{ index $s "s3-password" | quote }}
  STS_ACCESS_KEY_ID: {{ index $s "sts-user" | quote }}
  STS_SECRET_ACCESS_KEY: {{ index $s "sts-password" | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-tenant-env
  {{- include "forge.secretMetadata" . | nindent 2 }}
type: Opaque
stringData:
  POSTGRES_PASSWORD: {{ index $s "tenant-password" | quote }}
  DATABASE_URL: {{ printf "postgres://forge:%s@%s-tenant-postgres:5432/forge?sslmode=disable" (index $s "tenant-password") .Release.Name | quote }}
  TENANT_ENCRYPTION_KEY: {{ index $s "tenant-encryption-key" | quote }}
  PUBLIC_URL: {{ required "global.forge.publicURL is required" $f.publicURL | quote }}
  CA_FILE: /tls/ca.crt
  CASDOOR_URL: {{ required "global.forge.external.casdoorURL is required" $f.external.casdoorURL | quote }}
  CASDOOR_ORGANIZATION: {{ required "global.forge.external.organization is required" $f.external.organization | quote }}
  OIDC_ISSUER: {{ required "global.forge.external.issuer is required" $f.external.issuer | quote }}
  GITLAB_URL: {{ required "global.forge.external.gitlabURL is required" $f.external.gitlabURL | quote }}
  GITLAB_PUBLIC_URL: {{ required "global.forge.external.gitlabPublicURL is required" $f.external.gitlabPublicURL | quote }}
  GITLAB_OIDC_CLIENT_ID: {{ required "global.forge.external.gitlabOIDCClientID is required" $f.external.gitlabOIDCClientID | quote }}
  STORAGE_URL: {{ printf "https://%s-artifact.%s.svc:8443" .Release.Name .Release.Namespace | quote }}
  STORAGE_MANAGEMENT_TOKEN: {{ index $s "storage-management-token" | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-storage-credentials
  {{- include "forge.secretMetadata" . | nindent 2 }}
type: Opaque
stringData:
  MINIO_ROOT_USER: {{ index $s "s3-user" | quote }}
  MINIO_ROOT_PASSWORD: {{ index $s "s3-password" | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-identity-seed
  {{- include "forge.secretMetadata" . | nindent 2 }}
type: Opaque
stringData:
  OIDC_CLIENT_ID: {{ printf "%s-%s-console" .Release.Namespace .Release.Name | quote }}
  OIDC_CLIENT_SECRET: {{ index $s "oidc-secret" | quote }}
  CASDOOR_CLIENT_ID: {{ printf "%s-%s-management" .Release.Namespace .Release.Name | quote }}
  CASDOOR_SECRET: {{ index $s "casdoor-secret" | quote }}
  BOOTSTRAP_PASSWORD: {{ index $s "bootstrap-password" | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-external-credentials
  {{- include "forge.secretMetadata" . | nindent 2 }}
type: Opaque
{{- $external := lookup "v1" "Secret" .Release.Namespace (printf "%s-external-credentials" .Release.Name) }}
data: {{ ($external.data | default dict) | toJson }}
