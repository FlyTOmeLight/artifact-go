apiVersion: v1
kind: Namespace
metadata:
  name: artifact-storage
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: storage-data
  namespace: artifact-storage
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: storage
  namespace: artifact-storage
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels: {app: artifact-storage}
  template:
    metadata:
      labels: {app: artifact-storage}
    spec:
      initContainers:
        - name: prepare-volume
          image: busybox:1.37.0
          command: [sh, -ec, 'mkdir -p /storage/juicefs-data /storage/redis /storage/juicefs-cache']
          volumeMounts:
            - {name: data, mountPath: /storage}
      containers:
        - name: redis
          image: redis:7.4.2-alpine
          args: [redis-server, --appendonly, 'yes', --appendfsync, everysec, --bind, '127.0.0.1', --protected-mode, 'yes']
          readinessProbe:
            exec: {command: [redis-cli, ping]}
            initialDelaySeconds: 3
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {memory: 256Mi}
          volumeMounts:
            - {name: data, mountPath: /data, subPath: redis}
        - name: juicefs
          image: artifact-juicefs:1.4.1-arm64
          imagePullPolicy: Never
          command: [sh, -ec]
          args:
            - >-
              juicefs format --no-update --storage file
              --bucket /data
              --capacity 9 --trash-days 1
              redis://127.0.0.1:6379/1 artifact-jfs;
              exec juicefs gateway --multi-buckets --keep-etag --object-meta
              --cache-dir /cache --cache-size 256 --buffer-size 32
              --no-usage-report --no-banner
              redis://127.0.0.1:6379/1 0.0.0.0:9010
          env:
            - name: MINIO_ROOT_USER
              valueFrom: {secretKeyRef: {name: storage-credentials, key: MINIO_ROOT_USER}}
            - name: MINIO_ROOT_PASSWORD
              valueFrom: {secretKeyRef: {name: storage-credentials, key: MINIO_ROOT_PASSWORD}}
          ports: [{name: jfs-s3, containerPort: 9010}]
          readinessProbe: {tcpSocket: {port: 9010}, initialDelaySeconds: 5, periodSeconds: 5}
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {memory: 512Mi}
          volumeMounts:
            - {name: data, mountPath: /data, subPath: juicefs-data}
            - {name: data, mountPath: /cache, subPath: juicefs-cache}
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: storage-data}
---
apiVersion: v1
kind: Service
metadata:
  name: juicefs
  namespace: artifact-storage
spec:
  selector: {app: artifact-storage}
  ports: [{name: s3, port: 9000, targetPort: 9010}]
