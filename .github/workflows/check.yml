name: Check
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GOWORK: 'off'
      CGO_ENABLED: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Install pinned format and documentation tools
        run: |
          tool_dir="$(mktemp -d)"
          trap 'rm -rf "$tool_dir"' EXIT
          git clone --depth 1 --branch v0.9.0 https://github.com/FlyTOmeLight/go_fmt.git "$tool_dir"
          test "$(git -C "$tool_dir" rev-parse HEAD)" = "9d389e31b15509ae9cbdff326499929f715db78f"
          (cd "$tool_dir" && go install ./cmd/gorgeous)
          go install github.com/swaggo/swag/cmd/swag@v1.8.4
      - name: Warm Go build cache
        run: go build ./...
      - run: make check
      - name: Verify module metadata
        run: |
          go mod tidy
          go -C cmd/storage-bootstrap mod tidy
          git diff --exit-code -- go.mod go.sum cmd/storage-bootstrap/go.mod cmd/storage-bootstrap/go.sum
